name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned upstream schemas
        run: |
          bash tools/verify-upstream-pins.sh
          bash conformance/verify-upstream-schema-files.sh

      - name: Test Cargo workspace with development Rust
        run: cargo test --workspace --all-targets

      - name: Smoke-test Level-1 release fuzz and soak harnesses
        env:
          M40_FUZZ_MIN_CASES: 1000
          M40_FUZZ_SECONDS: 0
          M40_SOAK_MIN_SESSIONS: 1000
          M40_SOAK_SECONDS: 0
        run: |
          bash tools/run-m40-rpc-fuzz.sh
          bash tools/run-m40-level1-soak.sh

      - name: Model exact shared traversal accounting
        run: |
          cargo test -p capnp-message --features loom-tests loom_proves_competing_charges_preserve_the_hard_limit
          cargo test -p capnp-message --features loom-tests loom_parallel_plan_preserves_precharge_and_nested_budget
          cargo test -p capnp-message --features loom-tests loom_lane_arrival_order_finalizes_deterministically

      - name: Check public API examples and compile failures
        run: cargo test --workspace --doc

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check --config skip_children=true benchmarks/rpc/rust/main.rs
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Cargo workspace at MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 test --workspace --all-targets

      - name: Install pinned Bazelisk
        env:
          BAZELISK_VERSION: 1.29.0
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /tmp/bazelisk" | sha256sum --check
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazel

      - name: Test Bazel workspace
        run: bazel test //...

  miri-partitioned-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Miri
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component miri

      - name: Check disjoint partition storage under Miri
        run: cargo +nightly-2026-08-31 miri test -p capnp-message miri_disjoint_primitive_partitions_do_not_alias
