[support]
wire = "M10 borrowed and Arc-owned typed readers with stable coordinate references"
generated_api = "M37 typed data, exact pipelines, and eager ordered local streaming dispatch"
native_compiler = "M26 native multi-file compile and id CLI, plugin-compatible request streaming, deterministic built-in Rust output, and self-hosted generation without a system capnp compiler"
text_tools = "M27 bounded native text encode/decode/eval with standard, packed, and flat modes and pinned C++ short-format parity"
json = "M28 bounded reflection codec and native binary/packed/flat JSON conversion with pinned C++ policy and annotations"
rpc_level = "M38 cooperative cancellation, clean transport-complete shutdown, disconnect propagation, and generation-safe capability recreation, layered over M37 flow control"
flow_control = "M37 executor-neutral send-now/ack/readiness split with fixed extended windows, adaptive BDP windows, bounded in-flight bytes and waiters, and pinned C++ behavioral parity"
rpc_lifecycle = "M38 last-lease cancellation, application opt-out, legacy Finish deferral, noFinishNeeded handling, waiter-complete disconnect, surfaced shutdown errors, and disconnect-only reconnect classification"
rpc_scheduling = "M39 concurrent, FIFO serial, and keyed scheduling; bounded CPU/generic/Tokio-style executors; dedicated-thread non-Send local state"
local_capabilities = "M41 implementation candidate: promise/broken/disabled clients, shared and provisional pipelines, dynamic clients/servers, raw tail transfer, bounded capability lists, and exact-set local unwrap; activation awaits M40"
parallel_read = "M29 zero-copy Arc-owned list partitions and deterministic retained-subtree work plans for scoped or external executors"
parallel_build = "M30 disjoint primitive partitions plus sealed single-segment worker fragments with deterministic far-link finalization"
batch_pipeline = "M31 bounded reservation-window scheduling for ordered concurrent process/build/pack work with no-pool single-item paths"
std = "M16 sync partial-I/O and executor-neutral async framing adapters"
no_std_alloc = "M16 capnp-message and capnp-io alloc feature matrix"
no_allocation = "M16 capnp-wire plus caller-segment-buffer frame parsing"
construction = "M14 bounded schema-independent canonicalization and exact canonical checking"
packed = "M15 bounded incremental encoder and decoder with pinned C++ byte parity"

